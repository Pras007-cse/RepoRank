name = "projectstar-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Runs every 15 minutes. Batch size is deliberately small (see
# SYNC_BATCH_SIZE below / src/sync.ts) so each invocation finishes well
# within Workers' CPU time limit even on the free tier; at real scale,
# either shorten the interval, raise the batch size on a paid plan with a
# higher CPU limit, or fan out with Queues (see README "Scaling the sync").
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Non-secret config; set with `wrangler deploy` picking this up automatically.
[vars]
SYNC_BATCH_SIZE = "50"

# Secrets (never committed) — set with:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put SESSION_SIGNING_SECRET   (openssl rand -base64 32)
#   wrangler secret put GITHUB_APP_TOKEN          (optional, raises GitHub rate limit)
